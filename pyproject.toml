[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-ads-daily-report"
version = "0.1.0"
description = "One command: yesterday's Shopify orders + Meta Ads spend → ROAS, CPA, AOV in a Markdown report (and Slack if you want)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amir Šujić" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]


[tool.setuptools.packages.find]
include = ["adsreport*"]
