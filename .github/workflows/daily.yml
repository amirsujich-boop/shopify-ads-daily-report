name: daily report

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC, after Meta finishes yesterday's attribution refresh
  workflow_dispatch:

jobs:
  report:
    # Off until you set the repository variable ENABLE_DAILY_REPORT=true
    # (Settings -> Secrets and variables -> Actions -> Variables) and add the secrets below.
    if: ${{ vars.ENABLE_DAILY_REPORT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: adsreport --tz "+01:00" --target-roas 3 --slack --out "reports/$(date -d yesterday +%F).md"
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
